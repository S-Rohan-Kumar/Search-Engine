services:
  postgres:
    image: postgres:16-alpine
    container_name: crawlscope_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: crawlscope_user
      POSTGRES_PASSWORD: crawlscope_secret
      POSTGRES_DB: crawlscope
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crawlscope_user -d crawlscope"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: crawlscope_redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local